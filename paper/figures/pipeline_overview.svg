<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 460" font-family="Times New Roman, Times, serif" font-size="12">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#000"/>
    </marker>
    <marker id="arrowDashed" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#555"/>
    </marker>
  </defs>

  <!-- Title -->
  <text x="440" y="22" text-anchor="middle" font-size="14" font-weight="bold">Figure 1. farlip-mag-pipeline overview</text>
  <text x="440" y="40" text-anchor="middle" font-size="11" font-style="italic">Solid boxes: in-process Python stages. Dashed boxes: shell scripts emitted by the pipeline and executed on user infrastructure.</text>

  <!-- Inputs -->
  <rect x="20" y="90" width="120" height="80" rx="6" fill="#f5f5f5" stroke="#000" stroke-width="1"/>
  <text x="80" y="115" text-anchor="middle" font-weight="bold">Inputs</text>
  <text x="80" y="135" text-anchor="middle">JSC-1 reference</text>
  <text x="80" y="150" text-anchor="middle">37 polar MAGs</text>
  <text x="80" y="165" text-anchor="middle">(ENA PRJEB59431)</text>

  <!-- Phase 1 -->
  <rect x="180" y="90" width="150" height="80" rx="6" fill="#fff" stroke="#000" stroke-width="1.4"/>
  <text x="255" y="112" text-anchor="middle" font-weight="bold">Phase 1</text>
  <text x="255" y="128" text-anchor="middle">Reference + DB</text>
  <text x="255" y="142" text-anchor="middle">ingestion</text>
  <text x="255" y="160" text-anchor="middle" font-style="italic" fill="#555">manifest.tsv</text>

  <!-- Phase 2 -->
  <rect x="370" y="90" width="150" height="80" rx="6" fill="#fff" stroke="#000" stroke-width="1.4"/>
  <text x="445" y="112" text-anchor="middle" font-weight="bold">Phase 2</text>
  <text x="445" y="128" text-anchor="middle">16S extraction</text>
  <text x="445" y="142" text-anchor="middle">+ routing</text>
  <text x="445" y="160" text-anchor="middle" font-style="italic" fill="#555">phase2_manifest.tsv</text>

  <!-- Phase 3 -->
  <rect x="560" y="90" width="150" height="80" rx="6" fill="#fff" stroke="#000" stroke-width="1.4"/>
  <text x="635" y="112" text-anchor="middle" font-weight="bold">Phase 3</text>
  <text x="635" y="128" text-anchor="middle">FaRLiP detection</text>
  <text x="635" y="142" text-anchor="middle">Prodigal + HMMER</text>
  <text x="635" y="160" text-anchor="middle" font-style="italic" fill="#555">phase3_manifest.tsv</text>

  <!-- Phase 4 -->
  <rect x="750" y="90" width="120" height="80" rx="6" fill="#fff" stroke="#000" stroke-width="1.4"/>
  <text x="810" y="112" text-anchor="middle" font-weight="bold">Phase 4</text>
  <text x="810" y="128" text-anchor="middle">BUSCO QC</text>
  <text x="810" y="142" text-anchor="middle">+ MIMAG tier</text>
  <text x="810" y="160" text-anchor="middle" font-style="italic" fill="#555">phase4_manifest.tsv</text>

  <!-- Horizontal arrows between phases -->
  <line x1="140" y1="130" x2="178" y2="130" stroke="#000" stroke-width="1.2" marker-end="url(#arrow)"/>
  <line x1="330" y1="130" x2="368" y2="130" stroke="#000" stroke-width="1.2" marker-end="url(#arrow)"/>
  <line x1="520" y1="130" x2="558" y2="130" stroke="#000" stroke-width="1.2" marker-end="url(#arrow)"/>
  <line x1="710" y1="130" x2="748" y2="130" stroke="#000" stroke-width="1.2" marker-end="url(#arrow)"/>

  <!-- Externally-run scripts (dashed) -->
  <text x="440" y="215" text-anchor="middle" font-weight="bold" font-size="12">Externally-run shell scripts (user infrastructure, not counted in 135 s)</text>

  <!-- SILVA SINA from Phase 2 -->
  <rect x="290" y="235" width="170" height="60" rx="6" fill="#fafafa" stroke="#555" stroke-width="1.2" stroke-dasharray="5,3"/>
  <text x="375" y="257" text-anchor="middle" font-weight="bold">SILVA SINA</text>
  <text x="375" y="273" text-anchor="middle">ribosomal classification</text>
  <text x="375" y="287" text-anchor="middle" font-style="italic" fill="#555">silva_sina_input.fasta</text>

  <!-- GTDB-Tk from Phase 2 -->
  <rect x="480" y="235" width="170" height="60" rx="6" fill="#fafafa" stroke="#555" stroke-width="1.2" stroke-dasharray="5,3"/>
  <text x="565" y="257" text-anchor="middle" font-weight="bold">GTDB-Tk</text>
  <text x="565" y="273" text-anchor="middle">taxonomic placement</text>
  <text x="565" y="287" text-anchor="middle" font-style="italic" fill="#555">run_gtdbtk.sh (141 GB DB)</text>

  <!-- CheckM2 from Phase 4 -->
  <rect x="670" y="235" width="180" height="60" rx="6" fill="#fafafa" stroke="#555" stroke-width="1.2" stroke-dasharray="5,3"/>
  <text x="760" y="257" text-anchor="middle" font-weight="bold">CheckM2</text>
  <text x="760" y="273" text-anchor="middle">completeness/contamination</text>
  <text x="760" y="287" text-anchor="middle" font-style="italic" fill="#555">run_checkm2.sh</text>

  <!-- Dashed arrows from phases down to scripts -->
  <line x1="420" y1="170" x2="375" y2="233" stroke="#555" stroke-width="1" stroke-dasharray="4,3" marker-end="url(#arrowDashed)"/>
  <line x1="470" y1="170" x2="565" y2="233" stroke="#555" stroke-width="1" stroke-dasharray="4,3" marker-end="url(#arrowDashed)"/>
  <line x1="810" y1="170" x2="760" y2="233" stroke="#555" stroke-width="1" stroke-dasharray="4,3" marker-end="url(#arrowDashed)"/>

  <!-- Ingestion arrow back (CheckM2 results re-ingested) -->
  <path d="M760 295 Q 760 345 810 345 Q 825 345 825 320" fill="none" stroke="#555" stroke-width="1" stroke-dasharray="4,3" marker-end="url(#arrowDashed)"/>
  <rect x="430" y="312" width="290" height="14" fill="#fff"/>
  <text x="575" y="323" text-anchor="middle" font-size="10" fill="#555" font-style="italic">CheckM2/GTDB-Tk results re-ingested into manifests</text>

  <!-- Outputs -->
  <rect x="180" y="370" width="690" height="70" rx="6" fill="#f5f5f5" stroke="#000" stroke-width="1"/>
  <text x="525" y="392" text-anchor="middle" font-weight="bold">Outputs</text>
  <text x="525" y="411" text-anchor="middle">qc_report.tsv  ·  qc_filtered_mags.tsv  ·  Obsidian vault (per-MAG markdown)</text>
  <text x="525" y="427" text-anchor="middle" font-style="italic" fill="#555">FaRLiP classification + MIMAG tier + taxonomic placement, joined per MAG</text>

  <!-- Arrow from Phase 4 to outputs -->
  <line x1="525" y1="350" x2="525" y2="368" stroke="#000" stroke-width="1.2" marker-end="url(#arrow)"/>

  <!-- Timing badge -->
  <rect x="20" y="370" width="140" height="70" rx="6" fill="#eef" stroke="#224" stroke-width="1"/>
  <text x="90" y="392" text-anchor="middle" font-weight="bold">In-process</text>
  <text x="90" y="408" text-anchor="middle">~135 s</text>
  <text x="90" y="422" text-anchor="middle" font-size="10">(39 assemblies, 12-core)</text>
</svg>
