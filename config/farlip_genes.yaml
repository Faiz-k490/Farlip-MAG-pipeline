# Canonical 21-gene FaRLiP cluster catalog (Gan et al. 2014, Science 345:1312).
#
# Each entry maps a FaRLiP role name to its resolution strategy against the JSC-1
# reference (GCF_000733415.1). The cluster sits on contig NZ_KL662192.1 between
# 1,095,910 and 1,121,582 bp (~25.7 kb of contiguous DNA), 21 genes in order.
#
# Resolution priority used by src/profile_builder.py:
#   1. locus_tag (most precise; from the JSC-1 RefSeq GFF)
#   2. protein_id (RefSeq WP_* accession, cross-checked against protein.faa)
#   3. fallback match (gene_tag + product_substring, with cluster-locality tiebreak)
#
# When the secondary anchor (Chlorogloeopsis fritschii PCC 9212) is integrated in
# Phase 2.1, additional `anchors:` entries can be added to each gene without
# changing the schema.

schema_version: "1.0"
source: "Gan et al. 2014, Science 345:1312-1317. Cluster annotation cross-checked against the JSC-1 RefSeq GFF (GCF_000733415.1, generated 2026-05-10)."
primary_reference:
  assembly: "GCF_000733415.1"
  contig: "NZ_KL662192.1"
  cluster_start: 1095910
  cluster_end: 1121582

genes:
