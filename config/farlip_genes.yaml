    role: "PSII D1 paralog (far-red form; cluster position 1)"
    match:
      locus_tag: "OSCCY1_RS30350"
      protein_id: "WP_036011370.1"
      gene_tag: "psbA"
      product_substring: "photosystem II q(b)"

