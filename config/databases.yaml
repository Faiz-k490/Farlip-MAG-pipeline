# Phylogenetic and taxonomic database lock-in.
# Edit URLs / versions here to upgrade; the pipeline re-downloads and re-verifies.
# Human-readable rationale lives in DATA_SOURCES.md.

schema_version: "1.0"

silva:
  version: "138.2"
  release_date: "2024-07-11"
